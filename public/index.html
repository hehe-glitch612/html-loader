<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Loader</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111827;
        color: white;
        display: grid;
        place-items: center;
        height: 100vh;
      }

      .card {
        background: #1f2937;
        padding: 2rem 3rem;
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      h1 {
        margin-bottom: 0.5rem;
      }

      p {
        margin: 0;
        color: #d1d5db;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>HTML Loader</h1>
      <p>Your page is live on a separate port.</p>
    </div>
  </body>
</html>
